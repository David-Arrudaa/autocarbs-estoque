    <title>AutoCar BS - ERP Oficina</title>
    <script>
        // Redireciona direto para o sistema/login sem precisar clicar em nenhum botao intermediario

            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                window.location.replace('http://localhost:3000');
            } else {
                window.location.replace('https://autocarbs-estoque.vercel.app');
            }
        })();
    </script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;

            min-height: 100vh;

        }
        .loading-text {
            font-size: 0.95rem;
            color: #64748b;
        }
    </style>
</head>
