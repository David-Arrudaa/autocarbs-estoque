<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCar BS - ERP Oficina & Estoque</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #10181E;
            color: #F6F6F6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #18232C;
            border: 1px solid #263645;
            border-radius: 12px;
            padding: 40px 30px;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #F6F6F6; }
        h1 span { color: #93272C; }
        p { color: #98A7B5; font-size: 0.95rem; line-height: 1.6; }
        .badge {
            background: rgba(202, 161, 81, 0.15);
            color: #CAA151;
            border: 1px solid rgba(202, 161, 81, 0.35);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        .code-box {
            background: #0B1116;
            border: 1px solid #263645;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            color: #CAA151;
            margin: 20px 0;
            font-size: 1rem;
        }
        a.btn {
            display: inline-block;
            background: #93272C;
            color: #F6F6F6;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        a.btn:hover { background: #A82E34; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">SISTEMA ATUALIZADO PARA NODE.JS</span>
        <h1>AUTOCAR<span>BS</span> ERP</h1>
        <p>O sistema foi migrado para uma arquitetura segura em <strong>Node.js</strong> com separação completa de HTML, CSS e JavaScript.</p>
        
        <p>Para iniciar o servidor, execute no terminal:</p>
        <div class="code-box">npm start</div>
        
        <p>Em seguida, acesse no navegador:</p>
        <a class="btn" href="http://localhost:3000" target="_blank">Abrir http://localhost:3000</a>
    </div>
</body>
</html>
