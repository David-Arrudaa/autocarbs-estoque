<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCar BS - ERP Oficina & Estoque</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0f17;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #131b26;
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 14px;
            padding: 40px 30px;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
        }
        h1 {
            font-size: 1.9rem;
            margin: 0 0 10px 0;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        h1 span { color: #ef4444; }
        .badge {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.35);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 15px 0 25px 0;
        }
        a.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ef4444;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
        }
        a.btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">SISTEMA ONLINE (VERCEL)</span>
        <h1>AUTOCAR<span>BS</span> ERP</h1>
        <p>O sistema agora está hospedado online no Vercel com conexão segura e em tempo real ao banco de dados.</p>
        <a class="btn" href="https://autocarbs-estoque.vercel.app">Acessar Sistema Online</a>
    </div>
</body>
</html>
